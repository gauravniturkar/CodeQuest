<!DOCTYPE html>
<html lang="en" class="theme-booting" data-mode="dark" data-accent="citrus">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c0e" />
<meta name="description" content="CodeQuest — practise Python through AI-generated quizzes, challenges and a live leaderboard." />
<title>CodeQuest — Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script>
  // Applies the stored theme before first paint so there is no flash.
  (function () {
    try {
      var mode = localStorage.getItem('cq.mode') || 'dark';
      var accent = localStorage.getItem('cq.accent') || 'citrus';
      if (mode === 'system') {
        mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.mode = mode;
      document.documentElement.dataset.accent = accent;
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- ── ONBOARDING ─────────────────────────────────────────── -->
<div class="onboard" id="onboard">
  <div class="onboard-inner">
    <div class="onboard-mark">C</div>
    <h1>Ready to level up?</h1>
    <p>Pick a handle for the leaderboard. Your progress is saved on this device automatically.</p>
    <div class="onboard-form">
      <input class="input" id="name-input" type="text" placeholder="Your name…" maxlength="24" autocomplete="off" aria-label="Your name" />
      <button class="btn btn-primary" id="start-btn">Start practising →</button>
      <button class="btn btn-quiet" id="guest-btn">Continue as guest</button>
    </div>
  </div>
</div>

<!-- ── APP ────────────────────────────────────────────────── -->
<div class="app" id="app" hidden>

  <header class="topbar">
    <button class="icon-btn mobile-only" id="menu-btn" aria-label="Toggle sections" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
    </button>

    <a class="brand" href="/">
      <span class="brand-mark">C</span><span>CodeQuest</span>
    </a>

    <nav class="topnav" aria-label="Primary">
      <button type="button" data-route="problems" aria-current="page">Problems</button>
      <button type="button" data-route="board">Leaderboard</button>
    </nav>

    <div class="topbar-spacer"></div>

    <button class="cmd-trigger" id="cmd-btn" aria-label="Open command palette">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
      </svg>
      <span class="cmd-text">Search or jump to…</span>
      <span class="spacer"></span>
      <kbd>⌘K</kbd>
    </button>

    <div class="hud">
      <div class="chip optional" id="chip-streak" title="Answer streak">
        <span class="chip-icon" aria-hidden="true">🔥</span><span id="hud-streak">0</span>
      </div>
      <div class="chip optional" id="chip-score" title="Session score">
        <span class="chip-icon" aria-hidden="true">◆</span><span id="hud-score">0</span>
      </div>

      <div class="xp-ring" id="xp-ring" title="Total XP" role="img" aria-label="XP progress">
        <svg viewBox="0 0 32 32">
          <circle class="track" cx="16" cy="16" r="13.5" />
          <circle class="value" cx="16" cy="16" r="13.5" id="xp-arc"
                  stroke-dasharray="84.8" stroke-dashoffset="84.8" />
        </svg>
        <b id="xp-pct">0</b>
      </div>

      <button class="icon-btn" id="theme-btn" aria-label="Appearance settings" aria-expanded="false" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2v2.4M12 19.6V22M22 12h-2.4M4.4 12H2M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6" />
        </svg>
      </button>

      <div class="avatar" id="avatar" title="You">C</div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Sections"></aside>

  <main class="main" id="main">
    <div class="main-inner" id="view"></div>
  </main>

  <aside class="rail" id="rail" aria-label="Leaderboard and stats"></aside>
</div>

<!-- ── FLOATING UI ────────────────────────────────────────── -->
<div class="combo" id="combo" role="status" aria-live="polite"></div>

<div class="hint-drawer" id="hint" role="status" aria-live="polite">
  <div class="hint-title"><span aria-hidden="true">💡</span> Hint</div>
  <div class="hint-body" id="hint-body"></div>
</div>

<script type="module" src="/src/app.ts"></script>
</body>
</html>
